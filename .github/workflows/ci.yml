name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/web format:check
      - run: pnpm --filter @starter/web lint
      - run: pnpm --filter @starter/web typecheck
      - run: pnpm --filter @starter/web test
      - run: pnpm --filter @starter/web build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: starter_test
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://starter:ci-only-password@localhost:5432/starter_test
      APP_ENV: test
      DEV_MOCK_AUTH: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --project apps/api --all-groups --frozen
      - run: uv run --project apps/api ruff check apps/api scripts
      - run: uv run --project apps/api ruff format --check apps/api scripts
      - run: uv run --project apps/api mypy apps/api/src
      - run: uv run --project apps/api pytest apps/api/tests
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini check
      - run: uv run --project apps/api python scripts/export_openapi.py --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/web exec playwright install --with-deps chromium
      - run: pnpm --filter @starter/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-only-password
          TELEGRAM_BOT_TOKEN: obvious-ci-placeholder
          CORS_ALLOWED_ORIGINS: https://example.invalid
          TRUSTED_HOSTS: example.invalid
      - run: docker compose build api web gateway

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/web docs:check
      - run: bash scripts/secret_scan.sh
