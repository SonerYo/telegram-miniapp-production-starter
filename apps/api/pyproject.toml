[project]
name = "telegram-miniapp-production-starter-api"
version = "0.1.0"
description = "FastAPI backend for the Telegram Mini App Production Starter"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16.5,<2",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.1,<1",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=26.1.0,<27",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1",
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.8,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
omit = ["src/app/db/migrations/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

