name: telegram-miniapp-starter

services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starter}
      POSTGRES_USER: ${POSTGRES_USER:-starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - starter-db:/var/lib/postgresql
    networks: [starter]
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-starter}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-starter}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,api
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      DEV_MOCK_AUTH: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
    volumes:
      - ./apps/api/src:/app/src:ro
    networks: [starter]
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_MODE: http
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_ENABLE_BROWSER_MOCK: "true"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/index.html:/workspace/apps/web/index.html:ro
    networks: [starter]
    ports:
      - "5173:5173"

  gateway:
    profiles: [gateway]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    networks: [starter]
    ports:
      - "8080:8080"

networks:
  starter:
    driver: bridge

volumes:
  starter-db:
